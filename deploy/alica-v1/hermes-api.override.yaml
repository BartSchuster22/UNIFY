services:
  alica:
    image: unify-hermes-api:${RELEASE_ID:?RELEASE_ID is required}
    command: [gateway, run]
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
    secrets:
      - source: alica-api-token
        target: hermes-api-token

  herman:
    image: unify-hermes-api:${RELEASE_ID:?RELEASE_ID is required}
    command: [gateway, run]
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
    secrets:
      - source: herman-api-token
        target: hermes-api-token

secrets:
  alica-api-token:
    file: /opt/unify/secrets/alica-api-token
  herman-api-token:
    file: /opt/unify/secrets/herman-api-token
