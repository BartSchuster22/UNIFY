<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UNIFY</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f5f5f5;
        color: #222;
      }
      main {
        max-width: 48rem;
        margin: 10vh auto;
        padding: 2rem;
        background: white;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
      }
      code {
        background: #eee;
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
      }
      .ok {
        color: #176b36;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UNIFY</h1>
      <p>Gateway foundation is running. The Mantine operator interface is delivered in Phase 3.</p>
      <p id="status">Checking Gateway readiness…</p>
    </main>
    <script>
      fetch('/api/v1/health/ready')
        .then(async (r) => {
          const d = await r.json();
          const e = document.querySelector('#status');
          e.textContent = `Gateway: ${d.status} (${d.release})`;
          if (r.ok) e.className = 'ok';
        })
        .catch(() => {
          document.querySelector('#status').textContent = 'Gateway unavailable';
        });
    </script>
  </body>
</html>
