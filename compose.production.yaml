services:
  gateway:
    environment:
      NODE_ENV: production
      RELEASE_ID: ${RELEASE_ID:-unify-hermes-work-cutover}
      # Only native Hermes Work commands are enabled; every legacy write remains contained.
      DEPLOYMENT_MODE: mutation-canary
      MUTATION_DOMAINS: work
      MUTATION_ACCEPTANCE_REFS: work=phase6/hermes-work
  uniui:
    environment:
      HOST: 127.0.0.1
      PORT: ${UNIUI_PORT:-3000}
