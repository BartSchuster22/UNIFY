services:
  gateway:
    environment:
      NODE_ENV: production
      RELEASE_ID: ${RELEASE_ID:-unify-hermes-rebuild-phase0}
      # Phase 0 containment: no legacy-backed adapter may execute production writes.
      DEPLOYMENT_MODE: read-only
      MUTATION_DOMAINS: ''
      MUTATION_ACCEPTANCE_REFS: ''
  uniui:
    environment:
      HOST: 127.0.0.1
      PORT: ${UNIUI_PORT:-3000}
