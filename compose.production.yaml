services:
  gateway:
    environment:
      NODE_ENV: production
      RELEASE_ID: ${RELEASE_ID:-unify-hermes-profiles-models-cutover}
      # Profiles/providers are Hermes-owned reads. Unsupported Hermes writes remain visibly disabled.
      DEPLOYMENT_MODE: read-only
      MUTATION_DOMAINS: ''
      MUTATION_ACCEPTANCE_REFS: ''
  uniui:
    environment:
      HOST: 127.0.0.1
      PORT: ${UNIUI_PORT:-3000}
