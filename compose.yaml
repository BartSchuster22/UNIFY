name: unify

x-app-hardening: &app-hardening
  user: '65532:65532'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  mem_limit: 192m
  cpus: 0.5
  init: true
  stop_grace_period: 15s
  restart: unless-stopped
  tmpfs: ['/tmp:uid=65532,gid=65532,mode=0700']

x-job-hardening: &job-hardening
  user: '65532:65532'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 384m
  cpus: 0.5
  restart: 'no'
  tmpfs: ['/tmp:uid=65532,gid=65532,mode=0700']

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    user: '70:70'
    environment:
      POSTGRES_DB: unify
      POSTGRES_USER: unify
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${UNIFY_DB_PORT:-25432}:5432']
    tmpfs:
      - /tmp:uid=70,gid=70,mode=1770
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U unify -d unify -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *job-hardening
    image: unify-gateway:local
    network_mode: host
    command: [scripts/migrate.mjs, up]
    environment:
      DATABASE_URL_FILE: /run/secrets/gateway_database_url
    secrets: [gateway_database_url]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: unify-gateway:local
    environment:
      DATABASE_URL_FILE: /run/secrets/gateway_database_url
      AUTH_PEPPER_FILE: /run/secrets/gateway_auth_pepper
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: ${GATEWAY_PORT:-28081}
      RELEASE_ID: local-compose
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-600}
      ALLOWED_ORIGINS: https://uniui.aquiero.com,http://127.0.0.1:${UNIUI_PORT:-3000},http://localhost:${UNIUI_PORT:-3000},http://127.0.0.1:${CHAT_PWA_PORT:-3101},http://localhost:${CHAT_PWA_PORT:-3101},http://127.0.0.1:${ALERTS_PWA_PORT:-3102},http://localhost:${ALERTS_PWA_PORT:-3102}
      FRAMEWORK_AUTH_ENV_NAMES: HERMES_MAIN_CONTROL_TOKEN
      HERMES_MAIN_CONTROL_TOKEN_FILE: /run/secrets/hermes_main_control_token
      NODE_EXTRA_CA_CERTS: /run/secrets/hermes_adapter_ca
      HERMES_EVENT_POLL_MS: ${HERMES_EVENT_POLL_MS:-5000}
      MEMORY_V4_URL: ${MEMORY_V4_URL:-}
      MEMORY_V4_SCOPE_PATH: ${MEMORY_V4_SCOPE_PATH:-}
      MEMORY_V4_TOKEN_FILE: /run/secrets/memory_v4_token
      MEMORY_V4_TIMEOUT_MS: ${MEMORY_V4_TIMEOUT_MS:-8000}
      MEMORY_V4_MAX_RESPONSE_BYTES: ${MEMORY_V4_MAX_RESPONSE_BYTES:-16777216}
      MEMORY_V4_RETRIES: ${MEMORY_V4_RETRIES:-1}
    secrets:
      [
        gateway_database_url,
        gateway_auth_pepper,
        hermes_main_control_token,
        hermes_adapter_ca,
        memory_v4_token,
      ]
    network_mode: host
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s

  hermes-main-adapter:
    build:
      context: .
      dockerfile: Dockerfile.hermes-control-adapter
    image: unify-hermes-control-adapter:local
    user: '1001:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 160
    mem_limit: 768m
    cpus: 1.0
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    tmpfs: ['/tmp:uid=1001,gid=1000,mode=0700']
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 28082
      RELEASE_ID: ${RELEASE_ID:-local-compose}
      DATABASE_URL_FILE: /run/secrets/gateway_database_url
      HERMES_FRAMEWORK_ID: hermes-main
      HERMES_DISPLAY_NAME: Herman
      HERMES_BASE_PROFILE_DISPLAY_NAME: ${HERMES_BASE_PROFILE_DISPLAY_NAME:-Herman}
      HERMES_INSTANCE_ID: herman-local-private
      HERMES_ADAPTER_SCOPES: control:read,control:execute,control:events,control:secrets
      HERMES_ADAPTER_TOKEN_FILE: /run/secrets/hermes_main_control_token
      HERMES_ADAPTER_TLS_KEY_FILE: /run/secrets/hermes_adapter_tls_key
      HERMES_ADAPTER_TLS_CERT_FILE: /run/secrets/hermes_adapter_tls_cert
      HERMES_MANAGEMENT_BASE_URL: http://127.0.0.1:29119
      HERMES_MANAGEMENT_AUTOSTART: 'true'
      HERMES_HOME: /opt/data
    secrets:
      [
        gateway_database_url,
        hermes_main_control_token,
        hermes_adapter_tls_key,
        hermes_adapter_tls_cert,
      ]
    volumes:
      - type: bind
        source: /home/herman/.hermes
        target: /opt/data
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  bootstrap-admin:
    <<: *job-hardening
    profiles: [bootstrap]
    image: unify-gateway:local
    network_mode: host
    command: [dist/cli/bootstrap-admin.js]
    environment:
      DATABASE_URL_FILE: /run/secrets/gateway_database_url
      AUTH_PEPPER_FILE: /run/secrets/gateway_auth_pepper
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Administrator
    secrets: [gateway_database_url, gateway_auth_pepper, bootstrap_admin_password]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  uniui:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile.uniui
    image: unify-uniui:local
    environment:
      HOST: 127.0.0.1
      PORT: ${UNIUI_PORT:-3000}
      GATEWAY_INTERNAL_URL: http://127.0.0.1:${GATEWAY_PORT:-28081}
    network_mode: host
    depends_on:
      gateway: { condition: service_healthy }

  chat-pwa:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile.focused-pwa
      args: { APP: chat-pwa }
    image: unify-chat-pwa:local
    environment:
      HOST: 127.0.0.1
      PORT: ${CHAT_PWA_PORT:-3101}
      GATEWAY_INTERNAL_URL: http://127.0.0.1:${GATEWAY_PORT:-28081}
    network_mode: host
    depends_on:
      gateway: { condition: service_healthy }

  alerts-pwa:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile.focused-pwa
      args:
        APP: alerts-pwa
        VITE_UNIUI_URL: http://127.0.0.1:${UNIUI_PORT:-3000}
    image: unify-alerts-pwa:local
    environment:
      HOST: 127.0.0.1
      PORT: ${ALERTS_PWA_PORT:-3102}
      GATEWAY_INTERNAL_URL: http://127.0.0.1:${GATEWAY_PORT:-28081}
    network_mode: host
    depends_on:
      gateway: { condition: service_healthy }

secrets:
  postgres_password: { file: .secrets/postgres_password }
  gateway_database_url: { file: .secrets/gateway_database_url }
  gateway_auth_pepper: { file: .secrets/gateway_auth_pepper }
  bootstrap_admin_password: { file: .secrets/bootstrap_admin_password }
  hermes_main_control_token: { file: .secrets/hermes_main_control_token }
  memory_v4_token: { file: .secrets/memory_v4_token }
  hermes_adapter_ca: { file: .secrets/hermes_adapter_ca.crt }
  hermes_adapter_tls_key: { file: .secrets/hermes_adapter_tls.key }
  hermes_adapter_tls_cert: { file: .secrets/hermes_adapter_tls.crt }
volumes:
  postgres_data: {}
